<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Diocese Youth Day 2026 — schedules, directory, resources, and event info. Works offline after install.">
  <meta name="theme-color" content="#B91921">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="DYD 2026">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>DYD 2026</title>
  <link rel="manifest" href="/manifest.json">

  <script>
    // Chrome/Edge on Android: capture the install prompt for in-app "Install" button.
    (function () {
      var deferredPrompt = null;

      function isAndroid() {
        return /Android/i.test(navigator.userAgent);
      }

      function isIOS() {
        return /iPhone|iPad|iPod/i.test(navigator.userAgent);
      }

      function isStandalone() {
        return (
          window.matchMedia('(display-mode: standalone)').matches ||
          window.matchMedia('(display-mode: fullscreen)').matches ||
          window.navigator.standalone === true
        );
      }

      window.dydPwaIsStandalone = function () {
        return isStandalone();
      };

      window.dydPwaIsAndroid = function () {
        return isAndroid();
      };

      window.dydPwaIsIOS = function () {
        return isIOS();
      };

      window.dydPwaCanInstall = function () {
        return !!deferredPrompt;
      };

      window.dydPwaPromptInstall = async function () {
        if (!deferredPrompt) return false;
        deferredPrompt.prompt();
        var choice = await deferredPrompt.userChoice;
        deferredPrompt = null;
        return choice.outcome === 'accepted';
      };

      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        deferredPrompt = e;
        window.dispatchEvent(new Event('dyd-pwa-install-available'));
      });

      window.addEventListener('appinstalled', function () {
        deferredPrompt = null;
        window.dispatchEvent(new Event('dyd-pwa-installed'));
      });
    })();
  </script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
